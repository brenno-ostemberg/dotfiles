# Recarregar config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf recarregado!"

# Hide status bar
bind -n S-Up set -g status

# Mover entre painéis com hjkl (modo normal)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Com Alt + hjkl (fora do prefix)
bind -n M-H select-pane -L
bind -n M-J select-pane -D
bind -n M-K select-pane -U
bind -n M-L select-pane -R

# Mudar de janela
bind -n M-h previous-window
bind -n M-l next-window

# Mudar de sessão
bind -n M-j switch-client -n
bind -n M-k switch-client -p

# Criar/fechar janelas
bind -n M-t new-window
bind -n M-w kill-window

# Menu
bind -n M-m run -C 'display-menu -T "[ #[fg=red]Select a session#[default] ]" #{S:#S:#W "" "switch-client -t #S" }'
bind -n M-M choose-tree -s

# Renomear janelas rapidamente
bind -n M-r run-shell 'tmux rename-window -t 1 "Neovim"; tmux rename-window -t 2 "Makefile"; tmux rename-window -t 3 "Cardflow"; tmux rename-window -t 4 "Lazygit"; tmux rename-window -t 5 "Agent"; tmux refresh-client -S'

# Renomear sessão com o nome do diretório atual
bind -n C-M-r run-shell "tmux rename-session $(basename $(pwd))"

# tmux-sessionizer (tms)
bind -n M-o display-popup -E "tms"
bind -n M-s display-popup -E "tms switch"
bind -n M-W display-popup -E "tms windows"
bind C-k confirm -p "Kill current session? (y/N):" "run-shell 'tms kill'"
bind -n C-M-n command-prompt -p "Rename session to: " "run-shell 'tms rename %1'"

# Copy-mode estilo Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# t-smart-tmux-session-manager
bind-key x kill-pane
set -g detach-on-destroy off
